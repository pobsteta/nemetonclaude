<title>Plan d'actions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;600&family=Spectral:wght@500;600&display=swap">
<link rel="stylesheet" href="nemeton-view.css">
<style>
  /* Vue 3 : carte des UG | calendrier, tableau ou kanban | fiche d'action. */
  :root { --pl-panneau: 520px; }
  .pl { display: grid; min-height: 0; grid-template-columns: minmax(0, 1fr) var(--pl-panneau); position: relative; }
  /* Le kanban a besoin de place pour ses cinq colonnes. */
  .pl--large { grid-template-columns: minmax(280px, 1fr) min(860px, 64vw); }
  .pl *, .pl *::before, .pl *::after { box-sizing: border-box; }
  .pl__carte { position: relative; min-height: 0; }
  .pl__carte .nv-carte { position: absolute; inset: 0; }
  .pl__couleur {
    position: absolute; z-index: 800; top: 10px; right: 12px;
    background: var(--nv-surface); border: 1px solid var(--nv-trait); border-radius: var(--nv-r);
    box-shadow: var(--nv-ombre); padding: 6px 8px; display: flex; align-items: center; gap: 8px; font-size: 13px;
  }
  .pl__couleur select { font: inherit; }
  .pl__legende-liste { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 2px; }
  .pl__legende-liste li { display: flex; align-items: center; gap: 6px; }
  .pl__pastille { width: 14px; height: 10px; border-radius: 2px; flex: none; border: 1px solid rgba(0,0,0,.15); }

  .pl__panneau {
    min-height: 0; overflow: auto; background: var(--nv-surface); border-left: 1px solid var(--nv-trait);
    display: flex; flex-direction: column;
  }
  .pl__barre {
    position: sticky; top: 0; z-index: 3; background: var(--nv-surface);
    border-bottom: 1px solid var(--nv-trait); padding: 10px var(--nv-gouttiere) 0;
    display: flex; flex-direction: column; gap: 8px;
  }
  .pl__ligne { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .pl__filtre {
    display: inline-flex; align-items: center; gap: 6px; padding: 3px 4px 3px 10px; border-radius: 999px;
    background: var(--nv-action-voile); color: var(--nv-action-encre); font-weight: 700; font-size: 13px;
  }
  .pl__filtre button { border: 0; background: transparent; color: inherit; cursor: pointer; font-size: 15px; width: 24px; height: 24px; border-radius: 50%; }
  .pl__filtre button:hover { background: var(--nv-surface); }
  .pl__onglets { display: flex; margin: 0 calc(-1 * var(--nv-gouttiere)); }
  .pl__onglets button {
    flex: 1; padding: 9px 8px; border: 0; border-bottom: 2px solid transparent; background: transparent;
    font: 700 13px var(--nv-police-texte); color: var(--nv-encre-2); cursor: pointer;
  }
  .pl__onglets button[aria-selected="true"] { color: var(--nv-encre); border-bottom-color: var(--nv-action); }
  .pl__contenu { padding: 12px var(--nv-gouttiere) 18px; display: flex; flex-direction: column; gap: 14px; }

  /* Calendrier */
  .pl__annee h3 { font: 600 17px var(--nv-police-titre); margin: 0 0 6px; display: flex; gap: 8px; align-items: baseline; }
  .pl__annee h3 small { font: 400 12px var(--nv-police-texte); color: var(--nv-encre-2); }
  .pl__liste { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .pl__action {
    width: 100%; text-align: left; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px;
    padding: 8px 10px; border: 1px solid var(--nv-trait); border-left: 4px solid var(--pl-couleur, var(--nv-trait));
    border-radius: var(--nv-r); background: var(--nv-surface); color: var(--nv-encre); cursor: pointer; font: inherit;
  }
  .pl__action:hover { background: var(--nv-surface-2); }
  .pl__action[aria-current="true"] { outline: 2px solid var(--nv-action-encre); outline-offset: 1px; }
  .pl__action--claude { background: var(--nv-ia-voile); border-color: var(--nv-ia); border-left-color: var(--nv-ia); }
  .pl__action-titre { font-weight: 700; overflow-wrap: anywhere; }
  .pl__action-sous { grid-column: 1; font-size: 13px; color: var(--nv-encre-2); overflow-wrap: anywhere; }
  .pl__statut {
    grid-row: 1 / 3; grid-column: 2; align-self: center; font-size: 12px; font-weight: 700;
    padding: 2px 8px; border-radius: 999px; background: var(--nv-surface-2); white-space: nowrap;
  }
  .pl__statut[data-statut="validee"] { background: #dbe9f6; color: #1d4f7a; }
  .pl__statut[data-statut="planifiee"] { background: var(--nv-action-voile); color: var(--nv-action-encre); }
  .pl__statut[data-statut="realisee"] { background: var(--nv-action); color: var(--nv-action-texte); }
  .pl__statut[data-statut="abandonnee"] { text-decoration: line-through; color: var(--nv-encre-3); }
  .pl__vide { color: var(--nv-encre-2); font-size: 14px; margin: 0; }
  #message:empty { display: none; }

  /* Tableau */
  .pl__table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .pl__table th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--nv-encre-3); padding: 6px 6px; border-bottom: 1px solid var(--nv-trait); position: sticky; top: 0; background: var(--nv-surface); }
  .pl__table th button { all: unset; cursor: pointer; }
  .pl__table td { padding: 6px; border-bottom: 1px solid var(--nv-trait); vertical-align: top; }
  .pl__table tr { cursor: pointer; }
  .pl__table tbody tr:hover { background: var(--nv-surface-2); }
  .pl__table tr[aria-current="true"] { background: var(--nv-action-voile); }
  .pl__table .nv-num { text-align: right; white-space: nowrap; }
  .pl__defile { overflow-x: auto; }

  /* Kanban */
  .pl__kanban { display: grid; grid-template-columns: repeat(5, minmax(140px, 1fr)); gap: 8px; overflow-x: auto; padding-bottom: 4px; }
  .pl__colonne { background: var(--nv-surface-2); border-radius: var(--nv-r); padding: 8px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .pl__colonne h3 { font: 700 12px var(--nv-police-texte); text-transform: uppercase; letter-spacing: .06em; color: var(--nv-encre-2); margin: 0; display: flex; justify-content: space-between; }
  .pl__carte-k { background: var(--nv-surface); border: 1px solid var(--nv-trait); border-radius: var(--nv-r); padding: 7px 8px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
  .pl__carte-k--claude { border-color: var(--nv-ia); background: var(--nv-ia-voile); }
  .pl__carte-k > button.pl__ouvrir { all: unset; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
  .pl__carte-k > button.pl__ouvrir:focus-visible { outline: 2px solid var(--nv-action-encre); }
  .pl__transitions { display: flex; flex-wrap: wrap; gap: 4px; }
  .pl__transitions button { font: 700 11px var(--nv-police-texte); padding: 3px 6px; border-radius: 4px; border: 1px solid var(--nv-trait); background: var(--nv-surface); color: var(--nv-encre); cursor: pointer; }
  .pl__transitions button:hover { border-color: var(--nv-action-encre); }

  /* Fiche */
  .pl__fiche {
    position: absolute; z-index: 1100; top: 0; right: 0; bottom: 0; width: min(var(--pl-panneau), 100%);
    background: var(--nv-surface); border-left: 1px solid var(--nv-trait); box-shadow: var(--nv-ombre);
    overflow: auto; padding: 14px var(--nv-gouttiere) 20px; display: flex; flex-direction: column; gap: 12px;
  }
  .pl__fiche-tete { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .pl__fiche-tete h2 { font-size: 20px; overflow-wrap: anywhere; }
  .pl__fermer { border: 0; background: transparent; font-size: 22px; line-height: 1; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; color: var(--nv-encre-2); flex: none; }
  .pl__fermer:hover { background: var(--nv-surface-2); }
  .pl__form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
  .pl__form label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700; color: var(--nv-encre-2); min-width: 0; }
  .pl__form label.pl__large { grid-column: 1 / -1; }
  .pl__form input, .pl__form select, .pl__form textarea {
    font: 15px var(--nv-police-texte); color: var(--nv-encre); background: var(--nv-surface);
    border: 1px solid var(--nv-trait); border-radius: var(--nv-r); padding: 7px 8px; width: 100%; min-width: 0;
  }
  .pl__form textarea { min-height: 70px; resize: vertical; }
  .pl__form :disabled { background: var(--nv-surface-2); color: var(--nv-encre-2); }
  .pl__familles { grid-column: 1 / -1; border: 0; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 6px; }
  .pl__familles legend { font-size: 12px; font-weight: 700; color: var(--nv-encre-2); margin-bottom: 4px; padding: 0; }
  .pl__familles label { flex-direction: row; align-items: center; gap: 4px; font-weight: 400; font-size: 13px; color: var(--nv-encre); border: 1px solid var(--nv-trait); border-radius: 999px; padding: 2px 9px 2px 6px; }
  .pl__familles input { width: auto; }
  .pl__actions-fiche { display: flex; flex-wrap: wrap; gap: 8px; }
  .pl__danger { color: var(--nv-alerte); border-color: var(--nv-alerte); }
  .pl__confirmer { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 14px; }
  .pl__historique { list-style: none; margin: 0; padding: 0; font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
  .pl__historique li { border-left: 2px solid var(--nv-trait); padding-left: 8px; overflow-wrap: anywhere; }
  .pl__historique time { color: var(--nv-encre-2); font-family: var(--nv-police-chiffres); font-size: 12px; }
  .pl__lecture { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 14px; margin: 0; }
  .pl__lecture dt { color: var(--nv-encre-2); }
  .pl__lecture dd { margin: 0; overflow-wrap: anywhere; }

  /* UG et propositions */
  .pl__ug { border: 1px solid var(--nv-trait); border-radius: var(--nv-r); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
  .pl__ug h3 { font-size: 17px; }
  .pl__scores { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 4px 12px; font-size: 12px; }
  .pl__scores span { display: flex; justify-content: space-between; gap: 6px; }
  .pl__suggestion { display: flex; flex-direction: column; gap: 6px; padding: 8px 0; border-top: 1px dashed var(--nv-ia); }
  .pl__suggestion:first-of-type { border-top: 0; }
  .pl__exemple { font-size: 12px; color: var(--nv-encre-2); border: 1px dashed var(--nv-trait); border-radius: var(--nv-r); padding: 3px 8px; }
  .pl__resume { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; }
  .pl__resume .nv-chiffre { font-size: 18px; display: block; line-height: 1.1; }

  @media (max-width: 1100px) { :root { --pl-panneau: 440px; } }
  @media (max-width: 860px) {
    .nv-app { height: auto; min-height: 100%; }
    .pl, .pl--large { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(300px, 45vh) auto; }
    .pl__panneau { border-left: 0; border-top: 1px solid var(--nv-trait); overflow: visible; }
    .pl__fiche { position: fixed; top: auto; left: 0; right: 0; bottom: 0; width: 100%; max-height: 85vh; border-left: 0; border-top: 1px solid var(--nv-trait); border-radius: 12px 12px 0 0; }
    .pl__form { grid-template-columns: 1fr; }
    .pl__couleur { left: 12px; right: auto; top: auto; bottom: 12px; }
  }
</style>

<div class="nv-app">
  <header class="nv-entete">
    <div class="nv-entete__titre">
      <span class="nv-etiquette" data-t="surtitre">Plan d'actions</span>
      <h1 id="titre">—</h1>
    </div>
    <div class="pl__resume" id="resume"></div>
    <div class="nv-entete__outils" style="flex-wrap:wrap">
      <span class="pl__exemple" id="bandeau-exemple" hidden data-t="exemple">Données fictives</span>
      <button class="nv-bouton" type="button" id="btn-csv" hidden data-t="csv">CSV</button>
      <button class="nv-bouton" type="button" id="btn-marculus" hidden data-t="marculus">Paquet Marculus</button>
      <div class="nv-bascule" role="group" data-t-title="niveau">
        <button type="button" id="mode-simple" aria-pressed="true" data-t="simple">Vue simple</button>
        <button type="button" id="mode-expert" aria-pressed="false" data-t="experte">Vue experte</button>
      </div>
      <div class="nv-bascule" role="group" aria-label="Langue / Language">
        <button type="button" id="lang-fr" aria-pressed="true">FR</button>
        <button type="button" id="lang-en" aria-pressed="false">EN</button>
      </div>
    </div>
  </header>

  <main class="pl">
    <section class="pl__carte" aria-labelledby="titre-carte">
      <h2 id="titre-carte" class="nv-sr" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)" data-t="carte">Carte des unités de gestion</h2>
      <div class="nv-carte" id="carte"></div>
      <div class="pl__couleur">
        <label for="couleur" data-t="colorer">Couleur</label>
        <select id="couleur" class="nv-champ" style="padding:4px 6px">
          <option value="annee" data-t="c_annee">Prochaine action</option>
          <option value="type" data-t="c_type">Type</option>
          <option value="priorite" data-t="c_priorite">Priorité</option>
          <option value="statut" data-t="c_statut">Statut</option>
        </select>
      </div>
      <div class="nv-legende" id="legende"></div>
    </section>

    <section class="pl__panneau" aria-label="Actions">
      <div class="pl__barre">
        <div class="pl__ligne">
          <span class="pl__filtre" id="filtre-ug" hidden><span id="filtre-ug-texte"></span><button type="button" id="btn-sans-filtre" data-t-title="tout_afficher">×</button></span>
          <button class="nv-bouton nv-bouton--action" type="button" id="btn-nouvelle" hidden data-t="nouvelle">Nouvelle action</button>
        </div>
        <div class="pl__onglets" role="tablist" id="onglets">
          <button type="button" role="tab" id="onglet-calendrier" aria-selected="true" aria-controls="vue-calendrier" data-t="calendrier">Calendrier</button>
          <button type="button" role="tab" id="onglet-tableau" aria-selected="false" aria-controls="vue-tableau" data-t="tableau">Tableau</button>
          <button type="button" role="tab" id="onglet-kanban" aria-selected="false" aria-controls="vue-kanban" data-t="kanban">Kanban</button>
        </div>
      </div>
      <div class="pl__contenu">
        <p class="nv-statut" id="message" role="status" aria-live="polite"></p>
        <section class="pl__ug" id="bloc-ug" hidden aria-live="polite"></section>
        <div id="vue-calendrier" role="tabpanel" aria-labelledby="onglet-calendrier"></div>
        <div id="vue-tableau" role="tabpanel" aria-labelledby="onglet-tableau" hidden></div>
        <div id="vue-kanban" role="tabpanel" aria-labelledby="onglet-kanban" hidden></div>
      </div>
    </section>

    <aside class="pl__fiche" id="fiche" hidden role="dialog" aria-modal="false" aria-labelledby="fiche-titre"></aside>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="nemeton-view.js"></script>

    };
    var cols = ["id", "annee", "ug_id", "ug_label", "type", "type_libre", "intensite", "priorite", "statut", "volume_m3", "surface_ha", "nb_tiges", "cout_eur", "revenu_eur", "objectifs_lies", "commentaire", "origine"];
    var lignes = actions().map(function (a) {
      var q = a.quantite || {};
      var v = { id: a.id, annee: a.annee, ug_id: a.ug_id, ug_label: labelUG(a.ug_id), type: a.type, type_libre: a.type_libre, intensite: a.intensite,
        priorite: a.priorite, statut: a.statut, volume_m3: q.volume_m3, surface_ha: q.surface_ha, nb_tiges: q.nb_tiges, cout_eur: q.cout_eur,
        revenu_eur: q.revenu_eur, objectifs_lies: (a.objectifs_lies || []).join(" "), commentaire: a.commentaire, origine: a.source && a.source.origine };
      return cols.map(function (c) { return cel(v[c]); }).join(sep);
    });
    downloads.save({ filename: "plan_" + (etat.plan.projet || "projet") + ".csv", data: new Blob(["﻿" + [cols.join(sep)].concat(lignes).join("\r\n")], { type: "text/csv" }) })
      .then(function () { signaler(t("csv_ok"), 4000); }, function () { signaler(t("csv_refus"), 4000); });
  });
  $("btn-marculus").addEventListener("click", function () {
    var b = this; b.disabled = true; signaler(t("marculus_cours"));
    NV.appeler(mcp, "exporter_marculus", { projet: etat.plan.projet })
      .then(function (r) {
        var lien = r.urls && r.urls[r.fichier];
        var el = $("message");
        el.textContent = t("marculus_ok", { n: r.chantiers }) + " ";
        if (lien) { var a = document.createElement("a"); a.href = lien; a.target = "_blank"; a.rel = "noopener"; a.textContent = t("marculus_lien"); el.appendChild(a); }
        else el.appendChild(document.createTextNode(t("marculus_fichier", { f: r.fichier })));
      })
      .catch(function (e) { signaler(NV.messageMcp(e)); })
      .then(function () { b.disabled = false; });
  });

  /* ---------------------------------------------- rendu global et langue */
  function tout() {
    if (!etat.plan) return;
    $("titre").textContent = etat.plan.nom || etat.plan.projet;
    var types = (etat.plan.catalogue && etat.plan.catalogue.types_marculus) || [];
    $("btn-marculus").hidden = !(peutEcrire() && expert() && actions().some(function (a) { return types.indexOf(a.type) >= 0; }));
    $("btn-csv").hidden = !downloads;
    recolorer(); rendreListes(); rendreUG();
  }
  function majLangue() {
    NV.traduire();
    $("lang-fr").setAttribute("aria-pressed", String(NV.lang === "fr"));
    $("lang-en").setAttribute("aria-pressed", String(NV.lang === "en"));
    $("mode-simple").setAttribute("aria-pressed", String(etat.mode === "simple"));
    $("mode-expert").setAttribute("aria-pressed", String(etat.mode === "expert"));
    tout(); if (etat.action) rendreFiche();
  }
  $("lang-fr").addEventListener("click", function () { NV.changerLangue("fr"); majLangue(); });
  $("lang-en").addEventListener("click", function () { NV.changerLangue("en"); majLangue(); });

  /* ---------------------------------------------- chargement */
  Promise.all([NV.charger("plan.json"), NV.charger("plan.geojson"), NV.charger("contexte.geojson").catch(function () { return null; })])
    .then(function (r) {
      etat.meta = r[0];
      if (!etat.meta || !etat.meta.projet) throw new Error("plan.json");
      etat.plan = etat.meta;
      $("bandeau-exemple").hidden = !etat.meta.exemple;
      if (r[2]) NV.repere(carte, r[2], NV.styleContexte, "contexte");
      if (r[1] && r[1].features) {
        L.geoJSON(r[1], {
          style: function (f) { return styleUG(f.properties.ug_id); },
          onEachFeature: function (f, couche) {
            var id = f.properties.ug_id;
            etat.ugs.set(id, f.properties); etat.couches.set(id, couche);
            couche.bindTooltip(function () {
              var n = actionsUG(id).length, a = prochaine(id);
              var parc = NV.parcellesUG(f.properties);
              return "<strong>" + E(f.properties.label || id) + "</strong>" + (parc ? "<br><span class='nv-muet'>" + E(parc) + "</span>" : "") +
                "<br>" + E(t("n_actions", { n: n })) + (a ? "<br>" + E(a.annee + " · " + titreAction(a)) : "");
            }, { sticky: true });
            couche.on("click", function () { choisirUG(id, false); });
            groupe.addLayer(couche);
          }
        });
        if (groupe.getLayers().length) carte.fitBounds(groupe.getBounds(), { padding: [16, 16] });
      }
      majLangue();
      if (etat.meta.exemple) return;
      NV.capacite("sample").then(function (s) { sample = s; rendreUG(); });
      NV.capacite("downloads").then(function (d) { downloads = d; tout(); });
      NV.capacite("comments").then(function (c) { comments = c; if (etat.action) rendreFiche(); });
      return NV.capaciteNemeton().then(function (m) {
        mcp = m;
        if (!mcp) { tout(); return; }
        tout();
        suivre();
        NV.appeler(mcp, "profils_experts", { langue: NV.lang }, { cache: { staleTime: 300000 } })
          .then(function (r) { etat.profils = r.profils || []; rendreUG(); }, function () { /* profils facultatifs */ });
      });
    })
    .catch(function (e) {
      var a = document.createElement("p");
      a.className = "nv-alerte";
      a.textContent = t("erreur_donnees", { message: e.message });
      $("message").replaceWith(a);
    });
})();
</script>
