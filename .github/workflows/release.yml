# Publication automatique d'une version après chaque fusion sur main.
#
# Se lance quand le workflow CI réussit sur main (donc jamais sur du code
# rouge), ou à la main (Actions → release → Run workflow).
#
#   1. Si la version de r/DESCRIPTION n'a pas encore d'étiquette (montée à la
#      main dans la PR, ou première version), elle est publiée telle quelle.
#   2. Sinon, la version monte selon l'étiquette de la PR fusionnée :
#        version:majeure → X+1.0.0     version:mineure → X.Y+1.0
#        version:aucune  → rien        sans étiquette  → X.Y.Z+1 (correctif)
#      outils/version.mjs écrit la version dans r/DESCRIPTION, package.json,
#      plugin.json et ajoute à NEWS.md la liste des PR depuis la dernière
#      version ; le commit « Version X.Y.Z » est poussé sur main.
#   3. Étiquette annotée vX.Y.Z et release GitHub, avec la section de NEWS.md.
#
# Un push fait avec GITHUB_TOKEN ne relance aucun workflow : pas de boucle.
name: release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      niveau:
        description: "Montée de version (auto : selon l'étiquette de la dernière PR)"
        type: choice
        default: auto
        options: [auto, correctif, mineure, majeure, aucune]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      NIVEAU: ${{ inputs.niveau || 'auto' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Version à publier
        id: v
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          v="$(node outils/version.mjs)"
          if ! git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "v$v sans étiquette : publiée telle quelle."
            echo "version=$v" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          niveau="$NIVEAU"
          if [ "$niveau" = auto ]; then
            etiquettes="$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" \
              --jq '[.[0].labels[]?.name] | join(",")' 2>/dev/null || true)"
            echo "Étiquettes de la PR : ${etiquettes:-aucune}"
            case ",$etiquettes," in
              *,version:aucune,*)  niveau=aucune ;;
              *,version:majeure,*) niveau=majeure ;;
              *,version:mineure,*) niveau=mineure ;;
              *)                   niveau=correctif ;;
            esac
          fi
          if [ "$niveau" = aucune ]; then
            echo "Pas de nouvelle version demandée."
            exit 0
          fi
          if [ -z "$(git log "v$v..HEAD" --format=%h)" ]; then
            echo "Aucun commit depuis v$v : rien à publier."
            exit 0
          fi

          n="$(node outils/version.mjs monter "$niveau")"
          node outils/version.mjs verifier
          git commit -am "Version $n"
          git push origin HEAD:main
          echo "version=$n" >> "$GITHUB_OUTPUT"

      - name: Étiquette et release
        if: steps.v.outputs.version != ''
        run: |
          v="${{ steps.v.outputs.version }}"
          precedente="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)"
          node outils/version.mjs notes "$v" > notes.md
          [ -s notes.md ] || echo "Version $v." > notes.md
          if [ -n "$precedente" ]; then
            printf '\n**Changements** : %s/%s/compare/%s...v%s\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$precedente" "$v" >> notes.md
          fi
          git tag -a "v$v" -m "nemetonclaude $v"
          git push origin "v$v"
          gh release create "v$v" --title "v$v" --notes-file notes.md --verify-tag
          echo "Release v$v publiée." >> "$GITHUB_STEP_SUMMARY"
